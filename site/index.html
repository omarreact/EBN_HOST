<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e16">
  <meta name="description" content="PinFlix — Pure HTML & Vanilla JavaScript Streaming Platform">
  <title>PinFlix</title>

  <!-- Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#101211',
            surface: '#1b1e1c',
            accent: 'rgb(136, 181, 150)'
          }
        }
      }
    }
  </script>

  <!-- PinFlix Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <!-- Presentation-only override; no media, PHP, CDN or catalogue dependencies changed -->
  <link rel="stylesheet" href="css/cinematic-polish.css?v=2.1">

  <!-- HLS.js Streaming Engine CDN -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

  <!-- Embedded Catalogue Seed Data (instant offline/static availability) -->
  <script src="data/catalogue.js"></script>
</head>
<body>
  <div id="app"></div>

  <!-- SPA Router & Application Coordinator (Zero-Dependency Standalone Bundle) -->
  <script src="js/app.bundle.js"></script>
  <!-- Independent scroll/reveal animations; never touches playback or API calls -->
  <script src="js/cinematic-polish.js?v=2.1" defer></script>
</body>
</html>
