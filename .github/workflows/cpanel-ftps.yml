name: PinFlix cPanel — verify and deploy (FTPS)

on:
  push:
    branches: [cpanel-release]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/cpanel-ftps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinflix-cpanel-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify only cosmetic files are staged
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.source.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        name: Check initial site upload
        shell: bash
        run: |
          if [ -f site/index.html ] && [ -f site/css/cinematic-polish.css ] && [ -f site/js/cinematic-polish.js ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Initial setup: import working UI files before enabling deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate UI-only files and preserved player references
        if: steps.source.outputs.ready == 'true'
        run: python3 scripts/verify-ui-only.py
      - name: Check cosmetic JavaScript
        if: steps.source.outputs.ready == 'true'
        run: node --check site/js/cinematic-polish.js
  deploy:
    name: Upload UI files only to cPanel over FTPS
    needs: verify
    if: ${{ needs.verify.outputs.ready == 'true' && vars.CPANEL_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: cpanel-production
    steps:
      - uses: actions/checkout@v4
      - name: Require restricted FTPS account configuration
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.CPANEL_FTP_REMOTE_DIR }}
        shell: bash
        run: |
          test -n "$FTP_HOST" || { echo "Missing CPANEL_FTP_HOST"; exit 1; }
          test -n "$FTP_USER" || { echo "Missing CPANEL_FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASS" || { echo "Missing CPANEL_FTP_PASSWORD"; exit 1; }
          test -n "$FTP_DIR" || { echo "Missing CPANEL_FTP_REMOTE_DIR"; exit 1; }
          case "$FTP_DIR" in */) ;; *) echo "CPANEL_FTP_REMOTE_DIR must end with /"; exit 1 ;; esac
      - name: Stage cosmetic files only (no PHP, APIs, player or CDN)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cpanel-ui/css cpanel-ui/js
          cp site/index.html cpanel-ui/index.html
          cp site/css/cinematic-polish.css cpanel-ui/css/cinematic-polish.css
          cp site/js/cinematic-polish.js cpanel-ui/js/cinematic-polish.js
      - name: Incremental FTPS upload (never clean the server)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # The TLS certificate of ftp.akogs-fashion.com is issued only
          # for the verified canonical hostname below.
          server: bdix10.ebnserver.com
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./cpanel-ui/
          server-dir: ${{ secrets.CPANEL_FTP_REMOTE_DIR }}
          state-name: .pinflix-cpanel-ftps-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.gitkeep
          log-level: standard
