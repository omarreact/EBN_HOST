name: CineplexBD public page and CORS check (read-only)
on:
  push:
    branches: [cpanel-release]
    paths: [.github/workflows/cineplexbd-source-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read public source navigation and CORS headers (no saving)
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, html
          from html.parser import HTMLParser
          class Anchors(HTMLParser):
              def __init__(self):
                  super().__init__();self.rows=[];self.a=None
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="a":
                      self.a=[d.get("href",""),"",d.get("class","")]
              def handle_data(self,data):
                  if self.a:self.a[1]+=data
              def handle_endtag(self,tag):
                  if tag=="a" and self.a:
                      self.rows.append(self.a);self.a=None
          for path in ["/index.php","/category.php?page=1","/tvs.php","/search_ajax.php?q=batman&limit=2"]:
              url="http://cineplexbd.net"+path
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; PinFlixSourceAudit/1.0)","Origin":"http://pinflix.akogs-fashion.com"})
                  with urllib.request.urlopen(req,timeout=22) as r:
                      raw=r.read(250000);ctype=r.headers.get("Content-Type",""); acao=r.headers.get("Access-Control-Allow-Origin",""); final=r.url; status=r.status; frame=r.headers.get("X-Frame-Options","");csp=r.headers.get("Content-Security-Policy","")
                  print("PATH",path,"STATUS",status,"FINAL",final,"CONTENT-TYPE",ctype,"BYTES",len(raw))
                  print("CORS",acao if acao else "<absent>","XFRAME",frame if frame else "<absent>","CSP-FRAME-ANCESTORS",("frame-ancestors" in csp))
                  if "json" in ctype.lower():print("JSON",raw[:350].decode("utf-8","replace"))
                  else:
                      d=Anchors();d.feed(raw.decode("utf-8","replace"))
                      unique={}
                      for href,title,classes in d.rows:
                          clean=" ".join(title.split())[:70]
                          if href and (".php" in href or clean) and href not in unique:
                              unique[href]=clean
                      print("NAVIGATION",list(unique.items())[:80])
                      print("TITLE", re.search(r"<title[^>]*>(.*?)</title>",raw.decode("utf-8","replace"),re.I|re.S).group(1)[:100] if re.search(r"<title[^>]*>(.*?)</title>",raw.decode("utf-8","replace"),re.I|re.S) else "<missing>")
              except Exception as e:
                  print("PATH",path,"ERROR",str(e)[:280])
          PY
