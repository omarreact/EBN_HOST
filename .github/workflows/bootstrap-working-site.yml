name: PinFlix cPanel — one-time import of the verified working ZIP

on:
  push:
    branches: [cpanel-release]
    paths:
      - ".github/workflows/bootstrap-working-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    name: Import original live-working cPanel package (no deployment)
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/cpanel-release' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpanel-release
          persist-credentials: true
      - name: Retrieve the already-uploaded cPanel ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 2 \
            --connect-timeout 15 --max-time 120 \
            --proto '=https,http' --proto-redir '=https,http' \
            'http://pinflix.akogs-fashion.com/PinFlix-UI-Only-Working-Playback-cPanel.zip' \
            --output /tmp/pinflix-working.zip
          echo "Received file type:"
          file /tmp/pinflix-working.zip
          echo "Received file size:"
          wc -c </tmp/pinflix-working.zip
          echo "Received SHA256:"
          sha256sum /tmp/pinflix-working.zip | cut -d' ' -f1
          if ! unzip -tq /tmp/pinflix-working.zip >/dev/null 2>&1; then
            echo "::error::Hosting URL did not return a valid ZIP. No files were imported."
            exit 1
          fi
          echo "Archive is valid; each protected source file will be verified before commit."
      - name: Extract and verify the complete original site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          unzip -q -o /tmp/pinflix-working.zip -d site
          python3 scripts/verify-preserved.py
          php -l site/api.php
          node --check site/js/cinematic-polish.js
          grep -Fq 'cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js' site/index.html
          grep -Fq 'js/app.bundle.js' site/index.html
          grep -Fq 'css/cinematic-polish.css' site/index.html
          echo '99c11b002dba9159bff0eff6610a300fd31b12bf180d70f5ece3df3f4dc090f0  site/index.html' | sha256sum -c
          echo 'bc5522ddd5fe49c51c04832d8a8d2d4a2096297c105edfa1d5342d7e8f195e13  site/css/cinematic-polish.css' | sha256sum -c
          echo '65302c5de3a9298e7836c52d9ee2ed8f0787f338d6abe7052e7ca34ed6291782  site/js/cinematic-polish.js' | sha256sum -c
      - name: Commit verified cPanel files to cpanel-release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/
          if git diff --cached --quiet; then
            echo 'Already imported; no change.'
          else
            git commit -m 'chore(cpanel): import checksum-verified working PHP site [skip ci]'
            git push origin HEAD:cpanel-release
          fi
