name: PinFlix cPanel — read-only import of verified live site

on:
  push:
    branches: [cpanel-release]
    paths:
      - ".github/workflows/bootstrap-working-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    name: Read cPanel via FTPS and import protected files
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/cpanel-release' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cpanel-release
          persist-credentials: true
      - name: Download live site over FTPS (read-only) and verify SHA-256
        env:
          CPANEL_FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          CPANEL_FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          CPANEL_FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
          CPANEL_FTP_REMOTE_DIR: ${{ secrets.CPANEL_FTP_REMOTE_DIR }}
        run: python3 scripts/import-live-site-via-ftps.py
      - name: Verify playback, provider and site bundle unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-preserved.py
          php -l site/api.php
          node --check site/js/cinematic-polish.js
          grep -Fq 'cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js' site/index.html
          grep -Fq 'js/app.bundle.js' site/index.html
          grep -Fq 'css/cinematic-polish.css' site/index.html
      - name: Commit verified files into cpanel-release (never deploy to hosting)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/
          if git diff --cached --quiet; then
            echo 'Already imported; nothing to commit.'
          else
            git commit -m 'chore(cpanel): import verified working site source [skip ci]'
            git push origin HEAD:cpanel-release
          fi
